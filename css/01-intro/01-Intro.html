<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./01-intro.css">
    <title>introduction to CSS</title>
    <style>
        /* Standard CSS Syntax */

        /* selector {property:value;} */

        /* Element selector  */
        h1 {color: red;}

        /* id selector  */
        #blueText {color: blue;}

        /* class selector  */
        .greenTexts {color:green;}


    </style>
</head>
<body>
    <main>
        <h1>Red Text</h1>
        <p id="blueText">This is a blue text</p>
        <p class="greenTexts">This is a green text</p>
        <p class="greenTexts"> This is another green text </p>

        <hr>

        <section>
            <h3>CSS inline styles</h3>
            <p style="color: rgb(255, 255, 255); background-color: brown;">This is a paragraph</p>
        </section>

        <section>
           <h3>CSS External styles</h3> 
           <h6 id="small-Heading"> This is a small heading</h6>

        </section>
    </main>
    
</body>
</html>
