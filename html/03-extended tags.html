<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extended Tags</title>
</head>
<body>
    <main>
        <button type="button">click me</button>
        <figure>
            <img src="beach.jpg" alt="a beautiful beach">
            <figcaption>A beautiful beach</figcaption>
        </figure>
        <fieldset>
            <legend> A group of buttons </legend>
            <button>Button 1</button>
            <button>Button 2</button>
            <button>Button 3</button>
        </fieldset>
        <dialog open>
            Accept offer
        </dialog>
    </main>   
</body>
</html>
